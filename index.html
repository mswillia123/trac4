<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hex Mapper - Multi-Player</title>
  <!-- PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #1a1a1a;
      --panel-bg: #2a2a2a;
      --text-color: #e0e0e0;
      --accent-color: #4a7a96;
      --accent-hover: #5a8aa6;
      --border-color: #444444;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 320px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 15px;
      box-sizing: border-box;
      gap: 15px;
      z-index: 10;
    }

    .panel-section {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
    }

    .panel-section h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 5px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }

    label {
      font-size: 0.85rem;
      color: #aaa;
    }

    input[type="text"], select, button {
      background: #333;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    button {
      background: var(--accent-color);
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row > * {
      flex: 1;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      background-color: #111;
      overflow: hidden;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    #connection-status {
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      text-align: center;
      margin-top: 5px;
    }

    .status-disconnected { background: #622; color: #f88; }
    .status-connected { background: #262; color: #8f8; }
    .status-hosting { background: #246; color: #8cf; }

    #room-display {
      font-family: monospace;
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-align: center;
      background: #111;
      padding: 6px;
      border-radius: 4px;
      border: 1px dashed var(--accent-color);
      user-select: all;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Hex Mapper</h2>

    <!-- Networking Panel -->
    <div class="panel-section">
      <h3>Multiplayer Settings</h3>
      
      <div id="connection-status" class="status-disconnected">Disconnected</div>

      <div class="control-group" style="margin-top: 10px;">
        <button id="btnHost">Host New Game</button>
      </div>

      <div id="host-info" style="display: none;" class="control-group">
        <label>Room Code (Share with players):</label>
        <div id="room-display">----</div>
      </div>

      <hr style="border-color: var(--border-color); margin: 10px 0;">

      <div class="control-group">
        <label for="inputRoomCode">Join Existing Room:</label>
        <div class="row">
          <input type="text" id="inputRoomCode" placeholder="CODE" maxlength="4" style="text-transform: uppercase;">
          <button id="btnJoin">Join</button>
        </div>
      </div>
    </div>

    <!-- Map Tools Panel -->
    <div class="panel-section">
      <h3>Map Tools</h3>
      <div class="control-group">
        <label for="toolSelect">Active Tool:</label>
        <select id="toolSelect">
          <option value="select">Select / Move View</option>
          <option value="paint">Paint Terrain</option>
          <option value="clear">Clear Tile</option>
        </select>
      </div>
      <div class="control-group">
        <label for="terrainSelect">Terrain Type:</label>
        <select id="terrainSelect">
          <option value="#2e5a27">Plains (Green)</option>
          <option value="#1c3b18">Forest (Dark Green)</option>
          <option value="#5a5a5a">Mountains (Grey)</option>
          <option value="#2b4c6f">Water (Blue)</option>
          <option value="#8c764d">Desert (Yellow/Brown)</option>
        </select>
      </div>
      <div class="control-group">
        <button id="btnClearMap" class="host-only">Clear Entire Map</button>
      </div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="mapCanvas"></canvas>
  </div>

  <script>
    // --- Application State ---
    const HEX_RADIUS = 30;
    const MAP_WIDTH = 20;
    const MAP_HEIGHT = 15;

    let canvas = document.getElementById('mapCanvas');
    let ctx = canvas.getContext('2d');
    let container = document.getElementById('canvas-container');

    let cameraOffset = { x: 0, y: 0 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    // Hex Grid Data: Keyed by "col,row" -> { terrainColor }
    let hexData = {};

    // --- Networking State ---
    let peer = null;
    let hostConn = null;
    let clientConns = []; // Used by host to keep track of joined players
    let isHost = false;
    let roomCode = '';

    // PeerJS Configuration with fallback STUN + TURN servers
    const peerConfig = {
      secure: true,
      debug: 2, // Output detailed connection details in F12 console
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          {
            urls: 'turn:openrelay.metered.ca:80',
            username: 'openrelay',
            credential: 'openrelay'
          },
          {
            urls: 'turn:openrelay.metered.ca:443',
            username: 'openrelay',
            credential: 'openrelay'
          }
        ]
      }
    };

    // --- DOM Elements ---
    const btnHost = document.getElementById('btnHost');
    const btnJoin = document.getElementById('btnJoin');
    const inputRoomCode = document.getElementById('inputRoomCode');
    const hostInfo = document.getElementById('host-info');
    const roomDisplay = document.getElementById('room-display');
    const connectionStatus = document.getElementById('connection-status');
    const toolSelect = document.getElementById('toolSelect');
    const terrainSelect = document.getElementById('terrainSelect');
    const btnClearMap = document.getElementById('btnClearMap');

    // --- Canvas Resize & Initialization ---
    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      drawMap();
    }
    window.addEventListener('resize', resizeCanvas);

    // --- Networking Functions ---
    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let result = '';
      for (let i = 0; i < 4; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    function setStatus(text, className) {
      connectionStatus.textContent = text;
      connectionStatus.className = className;
    }

    // Host Room Initialization
    btnHost.addEventListener('click', () => {
      roomCode = generateRoomCode();
      const peerId = 'trac4-' + roomCode;

      if (peer) peer.destroy();
      peer = new Peer(peerId, peerConfig);

      btnHost.disabled = true;
      btnJoin.disabled = true;
      setStatus('Initializing Host...', 'status-disconnected');

      peer.on('open', (id) => {
        isHost = true;
        roomDisplay.textContent = roomCode;
        hostInfo.style.display = 'block';
        setStatus(`Hosting Room: ${roomCode}`, 'status-hosting');
        console.log('Host initialized with Peer ID:', id);
      });

      peer.on('connection', (conn) => {
        console.log('Client attempting to connect:', conn.peer);

        conn.on('open', () => {
          clientConns.push(conn);
          console.log('Client connected successfully. Sending full map state.');
          // Sync existing map state to newly joined client
          conn.send({ type: 'SYNC_MAP', data: hexData });
        });

        conn.on('data', (data) => {
          handleNetworkMessage(data, conn);
        });

        conn.on('close', () => {
          console.log('Client disconnected:', conn.peer);
          clientConns = clientConns.filter(c => c !== conn);
        });

        conn.on('error', (err) => {
          console.error('Host connection error with client:', err);
        });
      });

      peer.on('error', (err) => {
        console.error('Host PeerJS Error:', err);
        alert('Hosting Error: ' + err.type);
        btnHost.disabled = false;
        btnJoin.disabled = false;
        setStatus('Disconnected', 'status-disconnected');
      });
    });

    // Client Join Room Initialization
    btnJoin.addEventListener('click', () => {
      const code = inputRoomCode.value.trim().toUpperCase();
      if (code.length !== 4) return alert('Enter a valid 4-character Room Code');

      btnJoin.disabled = true;
      btnHost.disabled = true;
      btnJoin.textContent = 'Connecting...';
      setStatus('Connecting to Host...', 'status-disconnected');

      isHost = false;
      document.querySelectorAll('.host-only').forEach(el => el.style.display = 'none');

      if (peer) peer.destroy();
      peer = new Peer(peerConfig);

      // 10-Second Connection Timeout Threshold
      let connectionTimeout = setTimeout(() => {
        if (btnJoin.disabled && !hostConn) {
          alert('Connection timed out. Check the Room Code or ensure the Host is still online.');
          btnJoin.disabled = false;
          btnHost.disabled = false;
          btnJoin.textContent = 'Join';
          setStatus('Disconnected', 'status-disconnected');
        }
      }, 10000);

      peer.on('open', (id) => {
        console.log('Joining client initialized. Local Peer ID:', id);
        const targetHostId = 'trac4-' + code;

        hostConn = peer.connect(targetHostId, {
          reliable: true,
          serialization: 'json'
        });

        hostConn.on('open', () => {
          clearTimeout(connectionTimeout);
          console.log('Connected to host successfully!');
          roomCode = code;
          btnJoin.disabled = false;
          btnJoin.textContent = 'Join';
          setStatus(`Connected to Room: ${code}`, 'status-connected');
        });

        hostConn.on('data', (data) => {
          handleNetworkMessage(data);
        });

        hostConn.on('error', (err) => {
          clearTimeout(connectionTimeout);
          console.error('Client Host Connection Error:', err);
          alert('Failed to connect to host: ' + err);
          btnJoin.disabled = false;
          btnHost.disabled = false;
          btnJoin.textContent = 'Join';
          setStatus('Disconnected', 'status-disconnected');
        });

        hostConn.on('close', () => {
          alert('Disconnected from host.');
          location.reload();
        });
      });

      peer.on('error', (err) => {
        clearTimeout(connectionTimeout);
        console.error('PeerJS Client Error:', err);

        if (err.type === 'peer-unavailable') {
          alert(`Room "${code}" not found. Double-check the code or ensure the Host is actively online.`);
        } else {
          alert('Connection Failed (' + err.type + '). Please try again.');
        }

        btnJoin.disabled = false;
        btnHost.disabled = false;
        btnJoin.textContent = 'Join';
        setStatus('Disconnected', 'status-disconnected');
      });
    });

    // Handle Network Payloads
    function handleNetworkMessage(msg, senderConn = null) {
      if (!msg || !msg.type) return;

      switch (msg.type) {
        case 'SYNC_MAP':
          hexData = msg.data;
          drawMap();
          break;

        case 'UPDATE_TILE':
          hexData[msg.key] = msg.value;
          drawMap();
          // If host receives update from a client, broadcast to all other clients
          if (isHost) {
            broadcastNetworkMessage(msg, senderConn);
          }
          break;

        case 'CLEAR_MAP':
          hexData = {};
          drawMap();
          if (isHost) {
            broadcastNetworkMessage(msg, senderConn);
          }
          break;
      }
    }

    function broadcastNetworkMessage(msg, excludeConn = null) {
      clientConns.forEach(conn => {
        if (conn !== excludeConn && conn.open) {
          conn.send(msg);
        }
      });
    }

    function sendNetworkMessage(msg) {
      if (isHost) {
        broadcastNetworkMessage(msg);
      } else if (hostConn && hostConn.open) {
        hostConn.send(msg);
      }
    }

    // --- Hex Grid Geometry Helpers ---
    function getHexCorners(center) {
      let corners = [];
      for (let i = 0; i < 6; i++) {
        let angleDeg = 60 * i - 30; // Pointy-topped hexes
        let angleRad = Math.PI / 180 * angleDeg;
        corners.push({
          x: center.x + HEX_RADIUS * Math.cos(angleRad),
          y: center.y + HEX_RADIUS * Math.sin(angleRad)
        });
      }
      return corners;
    }

    function getHexCenter(col, row) {
      let width = Math.sqrt(3) * HEX_RADIUS;
      let height = 2 * HEX_RADIUS;
      let x = col * width + (row % 2) * (width / 2) + cameraOffset.x + canvas.width / 2 - 300;
      let y = row * (height * 0.75) + cameraOffset.y + canvas.height / 2 - 200;
      return { x, y };
    }

    function pixelToHex(x, y) {
      // Approximate hex picker for grid selection
      let width = Math.sqrt(3) * HEX_RADIUS;
      let height = 2 * HEX_RADIUS;

      let adjustedX = x - (cameraOffset.x + canvas.width / 2 - 300);
      let adjustedY = y - (cameraOffset.y + canvas.height / 2 - 200);

      let row = Math.round(adjustedY / (height * 0.75));
      let col = Math.round((adjustedX - (row % 2) * (width / 2)) / width);

      return { col, row };
    }

    // --- Canvas Rendering ---
    function drawHex(center, color = '#222222', strokeColor = '#444444') {
      let corners = getHexCorners(center);

      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 6; i++) {
        ctx.lineTo(corners[i].x, corners[i].y);
      }
      ctx.closePath();

      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < MAP_HEIGHT; r++) {
        for (let c = 0; c < MAP_WIDTH; c++) {
          let center = getHexCenter(c, r);
          let key = `${c},${r}`;
          let tile = hexData[key];
          let color = (tile && tile.terrainColor) ? tile.terrainColor : '#222222';

          drawHex(center, color);
        }
      }
    }

    // --- User Interaction ---
    container.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (toolSelect.value === 'select' || e.button === 1) { // Middle click or select mode
        isDragging = true;
        dragStart = { x: e.clientX - cameraOffset.x, y: e.clientY - cameraOffset.y };
        return;
      }

      const { col, row } = pixelToHex(mouseX, mouseY);
      if (col >= 0 && col < MAP_WIDTH && row >= 0 && row < MAP_HEIGHT) {
        const key = `${col},${row}`;

        if (toolSelect.value === 'paint') {
          const color = terrainSelect.value;
          hexData[key] = { terrainColor: color };
          drawMap();
          sendNetworkMessage({ type: 'UPDATE_TILE', key: key, value: hexData[key] });
        } else if (toolSelect.value === 'clear') {
          delete hexData[key];
          drawMap();
          sendNetworkMessage({ type: 'UPDATE_TILE', key: key, value: null });
        }
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        cameraOffset.x = e.clientX - dragStart.x;
        cameraOffset.y = e.clientY - dragStart.y;
        drawMap();
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    btnClearMap.addEventListener('click', () => {
      if (!isHost) return;
      if (confirm('Are you sure you want to clear the whole map?')) {
        hexData = {};
        drawMap();
        sendNetworkMessage({ type: 'CLEAR_MAP' });
      }
    });

    // --- Initial Setup ---
    resizeCanvas();
  </script>
</body>
</html>
