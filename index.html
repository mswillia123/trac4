<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trac4</title>
  <!-- PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --text-color: #e0e0e0;
      --accent-color: #0088cc;
      --accent-hover: #00a0f0;
      --player1-color: #e74c3c;
      --player2-color: #f1c40f;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-top: 20px;
      margin-bottom: 5px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      box-sizing: border-box;
    }

    .panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px 20px;
      width: 100%;
      box-sizing: border-box;
    }

    .net-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .row > * {
      flex: 1;
    }

    input[type="text"], button {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1rem;
    }

    input[type="text"] {
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      font-weight: bold;
    }

    button {
      background-color: var(--accent-color);
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      background-color: #444;
      cursor: not-allowed;
      opacity: 0.6;
    }

    #status-badge {
      font-size: 0.9rem;
      font-weight: bold;
      text-align: center;
      padding: 6px 12px;
      border-radius: 4px;
      margin-top: 5px;
    }

    .status-off { background-color: #422; color: #f88; }
    .status-on { background-color: #242; color: #8f8; }
    .status-wait { background-color: #442; color: #ff8; }

    #room-code-display {
      font-family: monospace;
      font-size: 1.4rem;
      letter-spacing: 4px;
      text-align: center;
      background: #111;
      padding: 8px;
      border-radius: 4px;
      border: 1px dashed var(--accent-color);
      user-select: all;
    }

    /* Game Board Layout */
    #board-container {
      position: relative;
      margin-top: 10px;
    }

    canvas {
      background-color: #1a1a24;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: block;
    }

    #game-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .player-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    .p1-dot { background-color: var(--player1-color); }
    .p2-dot { background-color: var(--player2-color); }
  </style>
</head>
<body>

  <h1>Trac4</h1>

  <div class="container">
    
    <!-- Networking / Matchmaking Panel -->
    <div class="panel">
      <div class="net-controls">
        <div id="status-badge" class="status-off">Offline</div>

        <div class="row">
          <button id="btnHost">Host New Game</button>
        </div>

        <div id="host-room-box" style="display: none;" class="row">
          <span style="font-size: 0.9rem; color: #aaa;">Room Code:</span>
          <div id="room-code-display">----</div>
        </div>

        <hr style="border-color: var(--border-color); margin: 5px 0; width: 100%;">

        <div class="row">
          <input type="text" id="inputRoomCode" placeholder="CODE" maxlength="4">
          <button id="btnJoin">Join Room</button>
        </div>
      </div>
    </div>

    <!-- Game Display Panel -->
    <div class="panel" style="display: flex; flex-direction: column; align-items: center;">
      <div id="game-info">
        <div class="player-indicator"><span class="dot p1-dot"></span> P1 (Host)</div>
        <div id="turn-display">Waiting for players...</div>
        <div class="player-indicator"><span class="dot p2-dot"></span> P2 (Joiner)</div>
      </div>

      <div id="board-container">
        <canvas id="trac4Canvas" width="400" height="400"></canvas>
      </div>

      <button id="btnReset" style="margin-top: 15px; width: 100%; display: none;">Reset Game</button>
    </div>

  </div>

  <script>
    // --- Game Logic State ---
    const GRID_SIZE = 4; // 4x4 Grid for Trac4
    const canvas = document.getElementById('trac4Canvas');
    const ctx = canvas.getContext('2d');
    const cellSize = canvas.width / GRID_SIZE;

    let gameState = {
      board: Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0)), // 0: empty, 1: P1, 2: P2
      turn: 1, // 1 or 2
      winner: null
    };

    let myPlayerNumber = 0; // 1 for Host, 2 for Client, 0 for Spectator/Offline

    // --- Networking State ---
    let peer = null;
    let hostConn = null;
    let clientConn = null;
    let isHost = false;
    let currentRoomCode = '';

    // Robust PeerJS ICE Configuration with STUN + OpenRelay TURN Fallbacks
    const peerConfig = {
      secure: true,
      debug: 2, // Displays WebRTC handshake progress in F12 Console
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          {
            urls: 'turn:openrelay.metered.ca:80',
            username: 'openrelay',
            credential: 'openrelay'
          },
          {
            urls: 'turn:openrelay.metered.ca:443',
            username: 'openrelay',
            credential: 'openrelay'
          }
        ]
      }
    };

    // --- DOM Elements ---
    const btnHost = document.getElementById('btnHost');
    const btnJoin = document.getElementById('btnJoin');
    const inputRoomCode = document.getElementById('inputRoomCode');
    const hostRoomBox = document.getElementById('host-room-box');
    const roomCodeDisplay = document.getElementById('room-code-display');
    const statusBadge = document.getElementById('status-badge');
    const turnDisplay = document.getElementById('turn-display');
    const btnReset = document.getElementById('btnReset');

    // --- Helper Utility Functions ---
    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let result = '';
      for (let i = 0; i < 4; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    function setStatus(text, className) {
      statusBadge.textContent = text;
      statusBadge.className = className;
    }

    // --- Host Matchmaking Setup ---
    btnHost.addEventListener('click', () => {
      currentRoomCode = generateRoomCode();
      const targetPeerId = 'trac4-' + currentRoomCode;

      if (peer) peer.destroy();
      peer = new Peer(targetPeerId, peerConfig);

      btnHost.disabled = true;
      btnJoin.disabled = true;
      setStatus('Registering Host Room...', 'status-wait');

      peer.on('open', (id) => {
        isHost = true;
        myPlayerNumber = 1;
        roomCodeDisplay.textContent = currentRoomCode;
        hostRoomBox.style.display = 'flex';
        setStatus(`Hosting Room [${currentRoomCode}] - Waiting for Player 2...`, 'status-wait');
        turnDisplay.textContent = 'Waiting for P2...';
        console.log('Host initialized with ID:', id);
      });

      peer.on('connection', (conn) => {
        console.log('Client connected:', conn.peer);
        clientConn = conn;

        clientConn.on('open', () => {
          setStatus(`Connected to Player 2! (Room ${currentRoomCode})`, 'status-on');
          btnReset.style.display = 'block';
          // Send initial state to joining player
          syncGameState();
        });

        clientConn.on('data', (data) => {
          handleNetworkPayload(data);
        });

        clientConn.on('close', () => {
          setStatus('Player 2 Disconnected', 'status-off');
          turnDisplay.textContent = 'P2 Left Game';
        });

        clientConn.on('error', (err) => {
          console.error('Host Connection Error:', err);
        });
      });

      peer.on('error', (err) => {
        console.error('Host PeerJS Error:', err);
        alert('Hosting Error: ' + err.type);
        btnHost.disabled = false;
        btnJoin.disabled = false;
        setStatus('Offline', 'status-off');
      });
    });

    // --- Joiner Matchmaking Setup ---
    btnJoin.addEventListener('click', () => {
      const code = inputRoomCode.value.trim().toUpperCase();
      if (code.length !== 4) return alert('Please enter a 4-character Room Code');

      btnJoin.disabled = true;
      btnHost.disabled = true;
      btnJoin.textContent = 'Connecting...';
      setStatus('Connecting to Host...', 'status-wait');

      isHost = false;
      myPlayerNumber = 2;

      if (peer) peer.destroy();
      peer = new Peer(peerConfig);

      // 10-Second Connection Timeout Guard
      let connectionTimeout = setTimeout(() => {
        if (btnJoin.disabled && (!hostConn || !hostConn.open)) {
          alert('Connection timed out. Verify room code or ask the Host to recreate the room.');
          btnJoin.disabled = false;
          btnHost.disabled = false;
          btnJoin.textContent = 'Join Room';
          setStatus('Offline', 'status-off');
        }
      }, 10000);

      peer.on('open', (id) => {
        console.log('Client Peer initialized:', id);
        const targetHostId = 'trac4-' + code;

        hostConn = peer.connect(targetHostId, {
          reliable: true,
          serialization: 'json'
        });

        hostConn.on('open', () => {
          clearTimeout(connectionTimeout);
          console.log('Successfully connected to Host!');
          currentRoomCode = code;
          btnJoin.disabled = false;
          btnJoin.textContent = 'Join Room';
          setStatus(`Connected to Room [${code}]!`, 'status-on');
        });

        hostConn.on('data', (data) => {
          handleNetworkPayload(data);
        });

        hostConn.on('error', (err) => {
          clearTimeout(connectionTimeout);
          console.error('Client Connection Error:', err);
          alert('Failed to connect to host: ' + err);
          btnJoin.disabled = false;
          btnHost.disabled = false;
          btnJoin.textContent = 'Join Room';
          setStatus('Offline', 'status-off');
        });

        hostConn.on('close', () => {
          alert('Host closed the connection.');
          location.reload();
        });
      });

      peer.on('error', (err) => {
        clearTimeout(connectionTimeout);
        console.error('PeerJS Client Error:', err);

        if (err.type === 'peer-unavailable') {
          alert(`Room "${code}" not found. Double check the code or ensure Host is online.`);
        } else {
          alert('Connection Failed (' + err.type + ').');
        }

        btnJoin.disabled = false;
        btnHost.disabled = false;
        btnJoin.textContent = 'Join Room';
        setStatus('Offline', 'status-off');
      });
    });

    // --- Network Messaging ---
    function handleNetworkPayload(data) {
      if (!data || !data.type) return;

      switch (data.type) {
        case 'SYNC_STATE':
          gameState = data.state;
          updateTurnDisplay();
          drawBoard();
          break;

        case 'MAKE_MOVE':
          if (isHost) {
            processMove(data.row, data.col, data.player);
          }
          break;

        case 'RESET_GAME':
          resetGameState();
          break;
      }
    }

    function syncGameState() {
      const payload = { type: 'SYNC_STATE', state: gameState };
      if (isHost && clientConn && clientConn.open) {
        clientConn.send(payload);
      } else if (!isHost && hostConn && hostConn.open) {
        hostConn.send(payload);
      }
      updateTurnDisplay();
      drawBoard();
    }

    // --- Game Logic & Interactions ---
    function updateTurnDisplay() {
      if (gameState.winner) {
        if (gameState.winner === 'DRAW') {
          turnDisplay.textContent = "Game Draw!";
        } else {
          turnDisplay.textContent = `Player ${gameState.winner} Wins!`;
        }
        return;
      }

      if (gameState.turn === myPlayerNumber) {
        turnDisplay.textContent = "Your Turn!";
      } else {
        turnDisplay.textContent = `Player ${gameState.turn}'s Turn`;
      }
    }

    function processMove(row, col, player) {
      if (gameState.board[row][col] !== 0 || gameState.winner !== null) return;
      if (gameState.turn !== player) return;

      gameState.board[row][col] = player;
      
      if (checkWin(player)) {
        gameState.winner = player;
      } else if (checkDraw()) {
        gameState.winner = 'DRAW';
      } else {
        gameState.turn = player === 1 ? 2 : 1;
      }

      syncGameState();
    }

    function checkWin(p) {
      const b = gameState.board;
      // Check Rows & Columns
      for (let i = 0; i < GRID_SIZE; i++) {
        if (b[i][0] === p && b[i][1] === p && b[i][2] === p && b[i][3] === p) return true;
        if (b[0][i] === p && b[1][i] === p && b[2][i] === p && b[3][i] === p) return true;
      }
      // Check Diagonals
      if (b[0][0] === p && b[1][1] === p && b[2][2] === p && b[3][3] === p) return true;
      if (b[0][3] === p && b[1][2] === p && b[2][1] === p && b[3][0] === p) return true;

      return false;
    }

    function checkDraw() {
      return gameState.board.every(row => row.every(cell => cell !== 0));
    }

    function resetGameState() {
      gameState = {
        board: Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0)),
        turn: 1,
        winner: null
      };
      syncGameState();
    }

    canvas.addEventListener('click', (e) => {
      if (gameState.winner !== null) return;
      if (gameState.turn !== myPlayerNumber) return;

      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const col = Math.floor(x / cellSize);
      const row = Math.floor(y / cellSize);

      if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
        if (isHost) {
          processMove(row, col, 1);
        } else {
          // Send requested move to host for verification
          if (hostConn && hostConn.open) {
            hostConn.send({ type: 'MAKE_MOVE', row: row, col: col, player: 2 });
          }
        }
      }
    });

    btnReset.addEventListener('click', () => {
      if (isHost) {
        resetGameState();
      }
    });

    // --- Rendering ---
    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Lines
      ctx.strokeStyle = '#333333';
      ctx.lineWidth = 2;
      for (let i = 1; i < GRID_SIZE; i++) {
        // Vertical
        ctx.beginPath();
        ctx.moveTo(i * cellSize, 0);
        ctx.lineTo(i * cellSize, canvas.height);
        ctx.stroke();

        // Horizontal
        ctx.beginPath();
        ctx.moveTo(0, i * cellSize);
        ctx.lineTo(canvas.width, i * cellSize);
        ctx.stroke();
      }

      // Draw Pieces
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const val = gameState.board[r][c];
          if (val !== 0) {
            const centerX = c * cellSize + cellSize / 2;
            const centerY = r * cellSize + cellSize / 2;
            const radius = cellSize * 0.35;

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = val === 1 ? '#e74c3c' : '#f1c40f';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
          }
        }
      }
    }

    // Initial render call
    drawBoard();
  </script>
</body>
</html>
