<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Hex Map Editor</title>
  <!-- Updated PeerJS CDN Link (jsDelivr) -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #1a1a1e;
      color: #e0e0e0;
      overflow: hidden;
    }

    #sidebar {
      width: 320px;
      background-color: #24242a;
      border-right: 1px solid #363640;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
    }

    h2, h3 {
      color: #ffffff;
    }

    .section {
      background: #2c2c34;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #3e3e4a;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 8px;
      background-color: #e6a23c;
      color: #1a1a1e;
    }

    .status-badge.connected {
      background-color: #67c23a;
      color: #ffffff;
    }

    .status-badge.error {
      background-color: #f56c6c;
      color: #ffffff;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      margin-top: 8px;
      background: #1a1a1e;
      border: 1px solid #4a4a58;
      color: #fff;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #409eff;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #66b1ff;
    }

    .color-palette {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .color-swatch {
      aspect-ratio: 1;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color-swatch.active {
      border-color: #ffffff;
      transform: scale(1.05);
    }

    #canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Hex Map Editor</h2>

    <!-- Multiplayer Setup -->
    <div class="section">
      <h3>Multiplayer Connection</h3>
      <p style="font-size: 0.85rem; color: #aaa; margin-top: 4px;">Share your ID or join a friend's session.</p>
      
      <div style="margin-top: 10px;">
        <label style="font-size: 0.8rem; color: #888;">YOUR ID:</label>
        <input type="text" id="my-id" readonly value="Generating ID...">
      </div>

      <div style="margin-top: 10px;">
        <label style="font-size: 0.8rem; color: #888;">JOIN HOST ID:</label>
        <input type="text" id="join-id" placeholder="Paste host Peer ID here">
        <button id="btn-connect">Connect to Host</button>
      </div>

      <div>
        <span id="connection-status" class="status-badge">Disconnected</span>
      </div>
    </div>

    <!-- Palette Selection -->
    <div class="section">
      <h3>Terrain Palette</h3>
      <div class="color-palette" id="palette"></div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="hexCanvas"></canvas>
  </div>

  <script>
    // --- APP CONFIG & STATE ---
    const HEX_RADIUS = 30;
    const GRID_COLS = 25;
    const GRID_ROWS = 20;

    const TERRAIN_COLORS = [
      '#2d5a27', // Grassland
      '#1e3f66', // Water
      '#8c6d46', // Dirt / Hills
      '#707070', // Mountains
      '#d2b48c', // Sand / Desert
      '#4b382a', // Swamp
      '#ffffff', // Snow
      '#1a1a1e'  // Void / Clear
    ];

    let currentColor = TERRAIN_COLORS[0];
    let mapData = {}; // Stores hex states by key "q,r": color
    const connections = []; // Active WebRTC data connections

    // --- CANVAS SETUP ---
    const canvas = document.getElementById('hexCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = document.getElementById('canvas-container').clientWidth;
      canvas.height = document.getElementById('canvas-container').clientHeight;
      drawGrid();
    }
    window.addEventListener('resize', resizeCanvas);

    // --- HEX MATH FUNCTIONS ---
    // Pointy-topped hexes
    function hexToPixel(q, r) {
      const x = HEX_RADIUS * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r) + 100;
      const y = HEX_RADIUS * (3/2 * r) + 100;
      return { x, y };
    }

    function pixelToHex(x, y) {
      const px = x - 100;
      const py = y - 100;
      const q = (Math.sqrt(3)/3 * px - 1/3 * py) / HEX_RADIUS;
      const r = (2/3 * py) / HEX_RADIUS;
      return cubeToAxial(cubeRound({ x: q, y: -q - r, z: r }));
    }

    function cubeRound(cube) {
      let rx = Math.round(cube.x);
      let ry = Math.round(cube.y);
      let rz = Math.round(cube.z);

      const x_diff = Math.abs(rx - cube.x);
      const y_diff = Math.abs(ry - cube.y);
      const z_diff = Math.abs(rz - cube.z);

      if (x_diff > y_diff && x_diff > z_diff) {
        rx = -ry - rz;
      } else if (y_diff > z_diff) {
        ry = -rx - rz;
      } else {
        rz = -rx - ry;
      }
      return { x: rx, y: ry, z: rz };
    }

    function cubeToAxial(cube) {
      return { q: cube.x, r: cube.z };
    }

    function drawHexagon(x, y, radius, fillColor) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 180) * (60 * i - 30);
        const hx = x + radius * Math.cos(angle);
        const hy = y + radius * Math.sin(angle);
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
      }
      ctx.closePath();
      
      ctx.fillStyle = fillColor || '#1e1e24';
      ctx.fill();
      ctx.strokeStyle = '#383842';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < GRID_ROWS; r++) {
        const rOffset = Math.floor(r / 2);
        for (let q = -rOffset; q < GRID_COLS - rOffset; q++) {
          const pos = hexToPixel(q, r);
          const key = `${q},${r}`;
          const hexColor = mapData[key] || '#1e1e24';
          drawHexagon(pos.x, pos.y, HEX_RADIUS, hexColor);
        }
      }
    }

    // Canvas Click Interaction
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const hex = pixelToHex(mouseX, mouseY);
      const key = `${hex.q},${hex.r}`;

      // Update local state
      mapData[key] = currentColor;
      drawGrid();

      // Broadcast change to all connected peers
      broadcast({
        type: 'HEX_UPDATE',
        key: key,
        color: currentColor
      });
    });

    // --- UI CONTROLS ---
    const paletteContainer = document.getElementById('palette');
    TERRAIN_COLORS.forEach((color, index) => {
      const swatch = document.createElement('div');
      swatch.className = `color-swatch ${index === 0 ? 'active' : ''}`;
      swatch.style.backgroundColor = color;
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        currentColor = color;
      });
      paletteContainer.appendChild(swatch);
    });

    const statusBadge = document.getElementById('connection-status');
    function updateStatus(text, type) {
      statusBadge.textContent = text;
      statusBadge.className = `status-badge ${type}`;
    }

    // --- PEERJS MULTIPLAYER IMPLEMENTATION ---
    
    // Configured with Google's public STUN servers to resolve NAT/firewall traversal issues
    const peer = new Peer({
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    });

    // 1. Local Peer Opened
    peer.on('open', (id) => {
      console.log('PeerJS initialized with ID:', id);
      document.getElementById('my-id').value = id;
      updateStatus('Ready for connections', '');
    });

    // 2. Incoming Connection Handler (Host Side)
    peer.on('connection', (conn) => {
      console.log('Incoming connection attempt from:', conn.peer);
      updateStatus('Connecting player...', '');

      // Wait until data channel is fully established
      conn.on('open', () => {
        console.log('Data channel open with player:', conn.peer);
        connections.push(conn);
        updateStatus(`Connected (${connections.length} player/s)`, 'connected');

        // Send full existing map state to newly connected player
        conn.send({
          type: 'INIT_STATE',
          mapData: mapData
        });
      });

      setupConnectionListeners(conn);
    });

    // 3. Outgoing Connection Handler (Guest Side)
    document.getElementById('btn-connect').addEventListener('click', () => {
      const hostId = document.getElementById('join-id').value.trim();
      if (!hostId) {
        alert('Please enter a Host ID');
        return;
      }

      updateStatus('Connecting...', '');
      console.log('Attempting connection to host:', hostId);

      const conn = peer.connect(hostId, { reliable: true });

      conn.on('open', () => {
        console.log('Connected successfully to host:', hostId);
        connections.push(conn);
        updateStatus('Connected to Host', 'connected');
      });

      setupConnectionListeners(conn);
    });

    // 4. Data & Disconnect Listeners
    function setupConnectionListeners(conn) {
      conn.on('data', (data) => {
        console.log('Received payload:', data);

        if (data.type === 'INIT_STATE') {
          mapData = data.mapData || {};
          drawGrid();
        } else if (data.type === 'HEX_UPDATE') {
          mapData[data.key] = data.color;
          drawGrid();
        }
      });

      conn.on('close', () => {
        console.log('Connection closed:', conn.peer);
        const index = connections.indexOf(conn);
        if (index > -1) connections.splice(index, 1);
        
        if (connections.length === 0) {
          updateStatus('Disconnected', '');
        } else {
          updateStatus(`Connected (${connections.length} player/s)`, 'connected');
        }
      });

      conn.on('error', (err) => {
        console.error('Connection channel error:', err);
        updateStatus('Connection Error', 'error');
      });
    }

    // 5. Global PeerJS Error Diagnostics
    peer.on('error', (err) => {
      console.error('PeerJS Global Error Type:', err.type);
      console.error('PeerJS Error Details:', err);
      
      let message = `Error: ${err.type}`;
      if (err.type === 'peer-unavailable') {
        message = 'Host ID not found or offline';
      } else if (err.type === 'webrtc') {
        message = 'WebRTC / STUN traversal failed';
      }
      
      updateStatus(message, 'error');
    });

    // Broadcast message to all active peers
    function broadcast(data) {
      connections.forEach(conn => {
        if (conn.open) {
          conn.send(data);
        }
      });
    }

    // Initialize Canvas on load
    resizeCanvas();
  </script>
</body>
</html>
